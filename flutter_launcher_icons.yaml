# dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"

  android: "launcher_icon"
  image_path_android: "assets/images/app_icon.png"
  min_sdk_android: 21
  ios: false
  remove_alpha_ios: true

  adaptive_icon_background: "#2FC6D7"
  adaptive_icon_foreground: "assets/images/adaptative_app_icon.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/images/monochrome_app_icon.png"